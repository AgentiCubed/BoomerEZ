<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mode Studio v5.0 — All-Harness Model Ops</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --bg:#0b0e12; --panel:#12161c; --panel2:#171c24; --edge:#232a33; --edge2:#2e3742;
  --ink:#e8ecf1; --dim:#8b95a3; --faint:#5b6472;
  --cyan:#4fc3f7; --amber:#ffb74d; --green:#66bb6a; --violet:#b388ff; --red:#ef6e6e;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
body.light{--bg:#f2f4f7;--panel:#ffffff;--panel2:#eaeef3;--edge:#d5dbe3;--edge2:#c2cad4;--ink:#1a2028;--dim:#5b6472;--faint:#9aa3af}
button{font-family:var(--mono);cursor:pointer}
input,textarea,select{font-family:var(--mono);background:var(--panel2);border:1px solid var(--edge2);color:var(--ink);border-radius:6px;padding:8px 10px;font-size:13px;outline:none}
input:focus,textarea:focus{border-color:var(--cyan)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ── status bar (signature) ── */
#modebar{display:flex;align-items:stretch;gap:0;background:var(--panel);border-bottom:1px solid var(--edge);user-select:none;flex-wrap:wrap}
#modebar .brand{padding:10px 16px;font-weight:800;letter-spacing:.5px;color:var(--cyan);border-right:1px solid var(--edge);display:flex;align-items:center;gap:8px}
#modebar .brand small{color:var(--faint);font-weight:400}
.mtab{padding:10px 14px;background:none;border:none;border-right:1px solid var(--edge);color:var(--dim);font-size:13px;display:flex;gap:8px;align-items:center;transition:color .15s, box-shadow .15s}
.mtab .k{font-size:10px;color:var(--faint);border:1px solid var(--edge2);border-radius:4px;padding:0 4px}
.mtab:hover{color:var(--ink)}
.mtab.active{color:var(--ink);box-shadow:inset 0 -2px 0 var(--cyan)}
#modebar .spacer{flex:1}
.iconbtn{background:none;border:none;border-left:1px solid var(--edge);color:var(--dim);padding:10px 14px;font-size:13px}
.iconbtn:hover{color:var(--ink)}
#harness-sel{background:var(--panel2);border:1px solid var(--edge2);color:var(--cyan);border-radius:6px;margin:8px 10px;padding:4px 8px;font-size:12px;font-weight:700}

#main{flex:1;overflow:auto;position:relative}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
h2.modehead{font-size:15px;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
p.modesub{color:var(--dim);font-size:12px;margin-bottom:16px}

/* category colors */
.c-session{--cat:var(--cyan)} .c-models{--cat:var(--amber)} .c-config{--cat:var(--green)} .c-info{--cat:var(--violet)} .c-custom{--cat:var(--red)}
.badge{font-size:10px;color:var(--cat);border:1px solid color-mix(in srgb,var(--cat) 45%,transparent);border-radius:4px;padding:1px 6px;text-transform:uppercase;letter-spacing:.5px}

/* command cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--cat);border-radius:8px;padding:12px;transition:border-color .15s,transform .1s}
.card:hover{border-color:var(--cat);transform:translateY(-1px)}
.card .cmd{font-weight:700;color:var(--cat);cursor:pointer;word-break:break-all}
.card .desc{color:var(--dim);font-size:12px;margin:6px 0}
.card .ex{color:var(--faint);font-size:11px;border-top:1px dashed var(--edge);padding-top:6px;margin-top:6px;display:none;word-break:break-all}
.card.showex .ex{display:block}
.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.minibtn{background:none;border:1px solid var(--edge2);color:var(--dim);border-radius:5px;font-size:11px;padding:2px 8px}
.minibtn:hover{color:var(--ink);border-color:var(--dim)}
.minibtn.danger:hover{color:var(--red);border-color:var(--red)}

.toolrow{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolrow input[type=text]{flex:1;min-width:200px}
.chip{background:var(--panel2);border:1px solid var(--edge2);color:var(--dim);border-radius:99px;padding:5px 12px;font-size:12px}
.chip.on{color:var(--ink);border-color:var(--cyan);box-shadow:0 0 8px color-mix(in srgb,var(--cyan) 30%,transparent)}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel);border:1px solid var(--green);color:var(--ink);border-radius:8px;padding:10px 18px;font-size:13px;transition:transform .25s;z-index:99;max-width:90vw;word-break:break-all}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast b{color:var(--green)}

/* modal */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
#modal-bg.open{display:flex}
#modal{background:var(--panel);border:1px solid var(--edge2);border-radius:10px;padding:22px;width:min(560px,92vw);max-height:85vh;overflow:auto}
#modal h3{font-size:14px;margin-bottom:12px;color:var(--cyan)}
#modal label{display:block;font-size:11px;color:var(--dim);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
#modal input,#modal textarea,#modal select{width:100%}
.modalfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn{background:var(--panel2);border:1px solid var(--edge2);color:var(--ink);border-radius:6px;padding:8px 16px;font-size:13px}
.btn.primary{border-color:var(--cyan);color:var(--cyan)}
.btn.primary:hover{background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.btn.danger{border-color:var(--red);color:var(--red)}

/* creativity */
#creat-layout{display:flex;gap:16px;align-items:flex-start}
#creat-canvas{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pocket{background:var(--panel);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.pocket-header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--edge);cursor:grab;background:var(--panel2)}
.pocket-header .dot{width:10px;height:10px;border-radius:3px;flex:none}
.pocket-header .pname{font-weight:700;font-size:12px;flex:1}
.pocket-content{min-height:60px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pchip{background:var(--panel2);border:1px solid var(--edge2);border-left:3px solid var(--cat);border-radius:6px;padding:6px 9px;font-size:12px;cursor:grab;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pchip:hover{border-color:var(--cat)}
.pchip .x{color:var(--faint);cursor:pointer;font-size:11px}
.pchip .x:hover{color:var(--red)}
#creat-side{width:250px;flex:none;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;position:sticky;top:0;max-height:calc(100vh - 140px);overflow:auto}
#creat-side h4{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
#creat-side input{width:100%;margin-bottom:8px}
.ghost{opacity:.4}
.sortable-drag{opacity:.9}

/* speed run + zen */
.termwrap{max-width:860px;margin:0 auto;padding:20px;display:flex;flex-direction:column;height:100%}
#sr-stats{display:flex;gap:24px;color:var(--dim);font-size:12px;margin-bottom:14px}
#sr-stats b{color:var(--cyan);font-size:18px;display:block}
#sr-hist{flex:1;overflow:auto;display:flex;flex-direction:column-reverse;gap:4px;padding-bottom:12px}
.histline{color:var(--dim);font-size:13px}
.histline b{color:var(--green)}
.termline{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--edge2);border-radius:8px;padding:6px 12px}
.termline .ps1{color:var(--cyan);font-weight:700}
.termline input{flex:1;background:none;border:none;font-size:15px;padding:8px 0}
#zen{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#zen .termline{background:none;border:none;width:min(700px,90vw)}
#zen input{color:#e8ecf1;font-size:20px}
#zen .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#333;font-size:11px}

/* quick session */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.preset{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px}
.preset h4{color:var(--amber);font-size:13px;margin-bottom:4px}
.preset .pm{color:var(--dim);font-size:11px;margin-bottom:8px}
.preset .pp{color:var(--faint);font-size:11px;border-left:2px solid var(--edge2);padding-left:8px;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* explorer */
.acc{background:var(--panel);border:1px solid var(--edge);border-radius:8px;margin-bottom:10px;overflow:hidden}
.acc-head{padding:11px 14px;display:flex;justify-content:space-between;cursor:pointer;font-weight:700;font-size:13px}
.acc-head:hover{background:var(--panel2)}
.acc-head .n{color:var(--faint);font-weight:400;font-size:11px}
.acc-body{display:none;border-top:1px solid var(--edge);padding:12px 14px;flex-direction:column;gap:10px}
.acc.open .acc-body{display:flex}
.acc-item{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.acc-item .cmd{color:var(--cat);font-weight:700;cursor:pointer;word-break:break-all}
.acc-item .d{color:var(--dim);font-size:12px;flex:1;min-width:160px}

/* challenge */
#ch-box{max-width:620px;margin:0 auto;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:26px;text-align:center}
#ch-q{font-size:15px;margin:18px 0;min-height:44px}
#ch-opts{display:grid;gap:8px;margin-top:14px}
#ch-opts .btn{text-align:left}
#ch-opts .btn.correct{border-color:var(--green);color:var(--green)}
#ch-opts .btn.wrong{border-color:var(--red);color:var(--red)}
#ch-score{display:flex;gap:22px;justify-content:center;color:var(--dim);font-size:12px;margin-bottom:6px}
#ch-score b{color:var(--amber);font-size:17px;display:block}
#ch-feedback{min-height:20px;font-size:12px;margin-top:12px}

/* macro */
#mac-layout{display:flex;gap:16px;align-items:flex-start}
#mac-list{flex:1;display:flex;flex-direction:column;gap:12px}
.macro{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px}
.macro h4{color:var(--violet);font-size:13px}
.macro .seq{margin:10px 0;display:flex;flex-direction:column;gap:5px;min-height:34px;border:1px dashed var(--edge2);border-radius:8px;padding:8px}
.macro .seq .pchip{cursor:grab}
kbd{background:var(--panel2);border:1px solid var(--edge2);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--dim)}
.helprow{display:flex;gap:10px;align-items:baseline;margin-bottom:8px;font-size:12px;color:var(--dim)}
/* fill-in-the-blank */
.fbrow{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px;margin-bottom:10px}
.fbdesc{color:var(--dim);font-size:12px;margin-bottom:8px}
.fbline{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.fblit{color:var(--ink);white-space:pre}
input.blank{padding:3px 6px;border-color:color-mix(in srgb,var(--cyan) 55%,transparent);color:var(--cyan);font-size:13px;width:auto}
input.blank:focus{border-color:var(--cyan)}
/* builder */
#bl-tray{min-height:52px;border:1px dashed var(--edge2);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;background:var(--panel);align-items:center}
#bl-tray .pchip{cursor:grab}
.bl-empty{color:var(--faint);font-size:12px}
#bl-preview{display:block;background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--cyan);border-radius:8px;padding:10px 12px;margin:10px 0 18px;color:var(--cyan);font-size:13px;word-break:break-all;min-height:38px;font-family:var(--mono)}
.bl-group{margin-bottom:12px}
.bl-group h4{font-size:11px;color:var(--dim);letter-spacing:.5px;margin-bottom:6px}
.bl-chips{display:flex;flex-wrap:wrap;gap:6px}
.bl-chips .chip:hover{color:var(--ink);border-color:var(--dim)}
.pchip.custom{border-left-color:var(--red)}
/* builder guide + status */
#bl-guide{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;margin-bottom:12px}
#bl-guide h4{font-size:11px;color:var(--dim);letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase}
#bl-guide input{width:100%;margin-bottom:8px}
#bl-goal-active{font-size:12px;color:var(--dim);margin-top:8px;min-height:16px}
#bl-goal-active .next{color:var(--cyan)}
#bl-goal-active .ok{color:var(--green)}
#bl-goal-active .warn{color:var(--amber)}
#bl-status{display:flex;gap:10px;align-items:baseline;font-size:12px;margin:0 0 10px;padding:9px 12px;border:1px solid var(--edge);border-radius:8px;background:var(--panel);color:var(--ink)}
#bl-status .ic{font-weight:800}
#bl-status.st-valid{border-color:color-mix(in srgb,var(--green) 55%,transparent)}
#bl-status.st-valid .ic{color:var(--green)}
#bl-status.st-partial{border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
#bl-status.st-partial .ic{color:var(--amber)}
#bl-status.st-invalid{border-color:color-mix(in srgb,var(--red) 60%,transparent)}
#bl-status.st-invalid .ic{color:var(--red)}
#bl-status i{color:var(--faint);font-style:normal}
.hint-next{border-color:var(--cyan)!important;color:var(--cyan)!important;animation:blpulse 1.2s ease-in-out infinite}
.hint-later{border-color:color-mix(in srgb,var(--cyan) 40%,transparent)!important}
@keyframes blpulse{0%,100%{box-shadow:0 0 4px color-mix(in srgb,var(--cyan) 25%,transparent)}50%{box-shadow:0 0 14px color-mix(in srgb,var(--cyan) 60%,transparent)}}
/* ═══ SIMPLE MODE (BoomerEZ standard: 18px+ type, 44px targets, visible help) ═══ */
body.simple-active #modebar{display:none}
#simple-root{max-width:820px;margin:0 auto;padding:32px 22px 80px;font-size:18px;line-height:1.6}
.sm-h1{font-size:30px;font-weight:800;line-height:1.25;margin-bottom:14px;color:var(--ink)}
.sm-h2{font-size:21px;font-weight:700;margin:34px 0 10px;color:var(--cyan)}
.sm-lead{font-size:18px;color:#c3ccd6;margin-bottom:20px}
body.light .sm-lead{color:#39424e}
.sm-lead.sm-tight{margin-bottom:12px}
.sm-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:34px}
.sm-card{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--panel);border:1px solid var(--edge2);border-left:5px solid var(--cyan);border-radius:12px;padding:18px 20px;min-height:44px;color:var(--ink);transition:border-color .15s,background .15s}
.sm-card:hover,.sm-card:focus-visible{background:var(--panel2);border-color:var(--cyan)}
.sm-card-t{font-size:19px;font-weight:700;line-height:1.35}
.sm-card-d{font-size:16px;color:#b4bec9}
body.light .sm-card-d{color:#4a5462}
.sm-primary{display:block;width:100%;min-height:60px;font-size:20px;font-weight:700;background:var(--cyan);color:#0b0e12;border:none;border-radius:12px;padding:16px;margin:20px 0 8px}
.sm-primary:hover,.sm-primary:focus-visible{filter:brightness(1.12)}
.sm-cmd{background:var(--panel);border:2px solid var(--cyan);border-radius:12px;padding:18px 20px;font-size:19px;line-height:2;word-break:break-word;display:flex;flex-wrap:wrap;align-items:center;gap:2px}
input.sm-blank{font-size:19px;padding:5px 10px;min-height:44px;border:2px solid var(--cyan);border-radius:8px;color:var(--cyan);background:var(--panel2);min-width:120px;flex:1}
.sm-pieces{list-style:none;display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.sm-pieces li{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:13px 16px}
.sm-pieces code{color:var(--cyan);font-weight:700;font-size:17px;flex:none}
.sm-pieces span{font-size:17px;color:#c3ccd6;flex:1;min-width:200px}
body.light .sm-pieces span{color:#39424e}
.sm-steps{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sm-os{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px 20px}
.sm-os h3{font-size:18px;color:var(--amber);margin-bottom:10px}
.sm-os ol{margin-left:20px;display:flex;flex-direction:column;gap:10px;font-size:17px;color:#c3ccd6}
body.light .sm-os ol{color:#39424e}
.sm-caution{background:color-mix(in srgb,var(--amber) 12%,transparent);border:2px solid var(--amber);border-radius:12px;padding:16px 18px;font-size:17px;margin-bottom:22px}
.sm-caution b{color:var(--amber)}
.sm-reassure{background:color-mix(in srgb,var(--green) 10%,transparent);border-left:5px solid var(--green);border-radius:8px;padding:14px 18px;font-size:17px;margin:26px 0 18px}
.sm-foot{border-top:1px solid var(--edge);padding-top:22px}
.sm-foot input{width:100%;font-size:18px;min-height:52px}
.sm-tiny{font-size:16px;color:var(--dim);margin-top:16px}
.sm-link{background:none;border:none;color:var(--cyan);font-size:16px;text-decoration:underline;padding:6px 2px;min-height:44px}
.sm-back{display:block;margin-bottom:18px;font-size:17px}
#simple-root :focus-visible{outline:3px solid var(--amber);outline-offset:3px}
@media(max-width:560px){#simple-root{padding:22px 16px 70px}.sm-h1{font-size:26px}}
@media(max-width:760px){#creat-layout,#mac-layout{flex-direction:column}#creat-side{width:100%;position:static;max-height:240px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<nav id="modebar"></nav>
<main id="main"></main>
<div id="toast"></div>
<div id="modal-bg"><div id="modal"></div></div>

<script>
/* ═══════════════ COMMAND DATABASE ═══════════════ */
const CATS = {session:'session', models:'models', config:'config', info:'info', custom:'custom'};
const BASE_COMMANDS = [
 {id:'run',      cmd:'ollama run deepseek-r1',            cat:'models',  desc:'Start an interactive DeepSeek-R1 chat session', ex:'ollama run deepseek-r1:8b'},
 {id:'run70',    cmd:'ollama run deepseek-r1:70b',        cat:'models',  desc:'Run the 70B variant (needs ~40GB+ RAM)', ex:'ollama run deepseek-r1:70b --verbose'},
 {id:'pull',     cmd:'ollama pull deepseek-r1',           cat:'models',  desc:'Download or update the model without starting a chat', ex:'ollama pull deepseek-r1:14b'},
 {id:'list',     cmd:'ollama list',                       cat:'models',  desc:'List all models installed locally', ex:'ollama list'},
 {id:'ps',       cmd:'ollama ps',                         cat:'models',  desc:'Show models currently loaded in memory', ex:'ollama ps'},
 {id:'stop',     cmd:'ollama stop deepseek-r1',           cat:'models',  desc:'Unload a running model from memory', ex:'ollama stop deepseek-r1'},
 {id:'rm',       cmd:'ollama rm deepseek-r1',             cat:'models',  desc:'Delete a model from disk', ex:'ollama rm deepseek-r1:70b'},
 {id:'showm',    cmd:'ollama show deepseek-r1',           cat:'models',  desc:'Show model details (params, template, license)', ex:'ollama show deepseek-r1 --modelfile'},
 {id:'serve',    cmd:'ollama serve',                      cat:'models',  desc:'Start the Ollama server manually (if not running as a service)', ex:'OLLAMA_HOST=0.0.0.0 ollama serve'},
 {id:'bye',      cmd:'/bye',                              cat:'session', desc:'Exit the chat session', ex:'/bye'},
 {id:'clear',    cmd:'/clear',                            cat:'session', desc:'Clear session context — model forgets the conversation', ex:'/clear'},
 {id:'help',     cmd:'/?',                                cat:'session', desc:'Show help for in-session commands', ex:'/? shortcuts'},
 {id:'save',     cmd:'/save my-session',                  cat:'session', desc:'Save the current chat as a named model snapshot', ex:'/save vermont-route-notes'},
 {id:'load',     cmd:'/load my-session',                  cat:'session', desc:'Load a previously saved session', ex:'/load vermont-route-notes'},
 {id:'multi',    cmd:'"""',                               cat:'session', desc:'Begin/end a multiline message', ex:'"""\\npaste multi-line text here\\n"""'},
 {id:'temp',     cmd:'/set parameter temperature 0.7',    cat:'config',  desc:'Creativity dial: 0 = deterministic, 1+ = adventurous', ex:'/set parameter temperature 0.2'},
 {id:'ctx',      cmd:'/set parameter num_ctx 8192',       cat:'config',  desc:'Context window size in tokens (more = more memory use)', ex:'/set parameter num_ctx 16384'},
 {id:'topp',     cmd:'/set parameter top_p 0.9',          cat:'config',  desc:'Nucleus sampling — lower trims unlikely tokens', ex:'/set parameter top_p 0.5'},

}

const NEEDS_ARG=new Set(['-m','-p','-ngl','-c','--temp','--port','-d','-H','--tensor-parallel-size','--max-model-len','--gpu-memory-utilization','--append-system-prompt','parameter','system','format','-sys']);
function glossFor(t){
  if(GLOSS[t])return GLOSS[t];
  if(/^https?:\/\//.test(t))return 'the server endpoint URL';
  if(/deepseek/i.test(t))return 'the model to use';
  if(/\.gguf$/.test(t))return 'a GGUF model file';
  if(/^\{/.test(t))return 'JSON payload';
  if(/^\d+(\.\d+)?$/.test(t))return 'a value';
  if(/^"/.test(t))return 'text argument';
  if(/^--?/.test(t))return 'a flag';
  return 'your text';
}
const DESTRUCTIVE=new Set(['rm','unload','llama-quantize']);
function analyzeChain(t){
  const R=(status,explain,hint)=>({status,explain,hint:hint||''});
  if(!t.length)return R('empty','Tray is empty — start with a BASE chunk, or pick a goal above and follow the glow.');
  const t0=t[0], last=t[t.length-1];
  const isArg=x=>x!==undefined&&!/^--?[a-zA-Z]/.test(x);
  const dangling=NEEDS_ARG.has(last);
  const danger=t.some(x=>DESTRUCTIVE.has(x))?' Careful — this one deletes or unloads; double-check the target.':'';
  if(t0==='ollama'){
    const verbs={run:'starts an interactive chat with',pull:'downloads',stop:'unloads',rm:'permanently deletes',show:'shows details for',cp:'copies',list:'lists your installed models',ps:'shows models loaded in memory',serve:'starts the Ollama server'};
    const v=t[1];
    if(!v)return R('partial','The Ollama program, with nothing to do yet.','Add an ACTION chunk (run, pull, list…).');
    if(!verbs[v])return R('invalid','"'+v+'" is not an ollama action.','Pick an ACTION chunk right after ollama.');
    if(['list','ps','serve'].includes(v))return R('valid','ollama '+v+' — '+verbs[v]+'.');
    if(v==='cp')return t.length>=4&&isArg(t[2])&&isArg(t[3])?R('valid','Copies model '+t[2]+' to '+t[3]+'.'):R('partial','ollama cp needs a source and a destination name.','Add two model names.');
    if(!isArg(t[2]))return R('partial','This '+verbs[v]+' … which model?','Add a MODEL chunk or custom text.');
    return R('valid','This '+verbs[v]+' '+t[2]+(t.length>3?', with extra options':'')+'.'+danger);
  }
  if(t0==='/set'){
    if(t[1]==='parameter')return t[2]&&t[3]?R('valid','Sets '+t[2]+' to '+t[3]+' for this chat session.'):(t[2]?R('partial','Setting '+t[2]+' … to what?','Add a VALUE chunk.'):R('partial','/set parameter — which one?','Add a PARAMETER chunk.'));
    if(t[1]==='system')return t[2]?R('valid','Gives the model standing instructions (a system prompt).'):R('partial','/set system needs the prompt text.','Add custom text in quotes.');
    if(t[1]==='format')return t[2]==='json'?R('valid','Forces replies to be valid JSON.'):R('partial','/set format — to what?','Add the json chunk.');
    return R('partial','/set — set what?','Add a SETTING chunk: parameter, system, or format.');
  }
  if(t0==='/show')return t[1]?R('valid','Shows the session\'s '+t[1]+'. Type it inside a running chat.'):R('partial','/show — show what?','Add info, parameters, system, or template as custom text.');
  if(['/clear','/compact','/model','/cost','/bye'].includes(t0))return R('valid','A chat command ('+ (GLOSS[t0]||'') +') — type it inside a running session, not the shell.');
  if(['llama-server','llama-cli','llama-bench'].includes(t0)){
    const mi=t.indexOf('-m');
    if(mi<0||!isArg(t[mi+1]))return R('partial',t0+' needs a model file.','Add -m followed by model.gguf (or a custom path).');
    if(dangling)return R('partial','The last flag ('+last+') is waiting for its value.','Add the value it expects.');
    const what={'llama-server':'serves the model over HTTP','llama-bench':'benchmarks the model\'s speed','llama-cli':'chats with the model in the terminal'}[t0];
    return R('valid','This '+what+' using '+t[mi+1]+'.'+danger);
  }
  if(t0==='lms'){
    const sub=t[1];
    if(!sub)return R('partial','The LM Studio CLI with no subcommand.','Add one: ls, ps, get, load, unload, server…');
    if(['ls','ps'].includes(sub))return R('valid','Lists '+(sub==='ls'?'downloaded':'currently loaded')+' models.');
    if(['get','load'].includes(sub))return isArg(t[2])?R('valid',(sub==='get'?'Searches for and downloads ':'Loads ')+t[2]+'.'):R('partial','lms '+sub+' — which model?','Add a model name as custom text.');
    if(sub==='unload')return R('valid','Unloads '+(t.includes('--all')?'all models':'a model')+' from memory.'+danger);
    if(sub==='server')return ['start','status','stop'].includes(t[2])?R('valid','LM Studio server: '+t[2]+'.'):R('partial','lms server — start, status, or stop?','Add start or status.');
    if(sub==='log')return R('valid','Streams the server logs live.');
    return R('invalid','"'+sub+'" isn\'t an lms subcommand.','Use ls, ps, get, load, unload, server, or log.');
  }
  if(t0==='vllm')return t[1]==='serve'?(isArg(t[2])?(dangling?R('partial','The last flag is waiting for its value.','Add the value.'):R('valid','Serves '+t[2]+' with an OpenAI-compatible API.')):R('partial','vllm serve — which Hugging Face model?','Add the MODEL chunk or custom org/model.')):R('partial','vllm — serve is the move here.','Add the serve chunk.');
  if(t0==='claude'){
    if(dangling)return R('partial','The last flag ('+last+') needs its text.','Add custom text in quotes.');
    if(t.includes('-p'))return R('valid','Asks Claude Code one question and prints the answer.');
    if(t.includes('--continue'))return R('valid','Resumes your most recent Claude Code session.');
    return R('valid','Starts an interactive Claude Code session in the current directory.');
  }
  if(t0==='curl'){
    const url=t.find(x=>/^https?:\/\//.test(x));
    if(!url)return R('partial','curl — request what?','Add an endpoint URL chunk.');
    if(dangling)return R('partial','The last flag ('+last+') needs its value.','Add the header or body it expects.');
    return R('valid','Sends an HTTP request to '+url.replace(/^https?:\/\//,'')+(t.includes('-d')?' with a JSON body':'')+'.');
  }
  if(/^--?/.test(t0))return R('invalid','A chain can\'t start with a flag — flags modify a command.','Start with a BASE chunk like ollama or llama-server.');
  return R('unknown','Not a pattern I recognize. It may still be valid shell, but I can\'t vouch for it.','Start from a BASE chunk, or pick a goal above.');

/* ═══════════════ UTILITIES ═══════════════ */
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
let toastTimer;
function toast(msg,kind){
  const t=document.getElementById('toast');
  t.style.borderColor=kind==='err'?'var(--red)':'var(--green)';
  t.innerHTML=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
function copyText(txt){
  const done=()=>toast('<b>copied</b> → '+esc(txt));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  }else fallback();
  function fallback(){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');done();}catch(e){toast('Copy failed — select manually','err');}
    ta.remove();
  }
}
function applyTheme(){document.body.classList.toggle('light',Store.data.theme==='light');}

/* modal helper */
function openModal(html,onMount){
  const bg=document.getElementById('modal-bg'),m=document.getElementById('modal');
  m.innerHTML=html;bg.classList.add('open');if(onMount)onMount(m);
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal();});

const ModeStudio={
  modes:{},order:[],activeMode:null,
  registerMode(m){this.modes[m.id]=m;this.order.push(m.id);},
  switchMode(id){
    if(!this.modes[id])id='control';
    const cur=this.modes[this.activeMode];
    if(cur&&cur.destroy)cur.destroy();
    this.activeMode=id;Store.data.activeMode=id;
    document.body.classList.toggle('simple-active',id==='simple');
    const mode=this.modes[id];
    document.getElementById('main').innerHTML=mode.render();
    if(mode.init)mode.init();
    document.querySelectorAll('.mtab').forEach(b=>b.classList.toggle('active',b.dataset.mode===id));
  },
  buildBar(){
    const bar=document.getElementById('modebar');
    bar.innerHTML='<div class="brand">MODE_STUDIO <small>v5.0</small></div>';
    const sel=document.createElement('select');sel.id='harness-sel';sel.title='Active harness';
    HARNESSES.forEach(h=>{const o=document.createElement('option');o.value=h.id;o.textContent=h.name;sel.appendChild(o);});
    sel.value=Store.data.harness||'all';
    sel.onchange=()=>{Store.data.harness=sel.value;ModeStudio.switchMode(ModeStudio.activeMode);};
    bar.appendChild(sel);
    this.order.forEach((id,i)=>{
      const m=this.modes[id];
      const b=document.createElement('button');
      b.className='mtab';b.dataset.mode=id;
      b.innerHTML=esc(m.icon)+' '+esc(m.name)+(i<9?' <span class="k">^'+(i+1)+'</span>':'');
      b.onclick=()=>this.switchMode(id);
      bar.appendChild(b);
    });
    const sp=document.createElement('div');sp.className='spacer';bar.appendChild(sp);
    const easy=document.createElement('button');easy.className='iconbtn';easy.textContent='← Simple';
    easy.title='Back to the simple version';easy.onclick=()=>this.switchMode('simple');bar.appendChild(easy);
    const help=document.createElement('button');help.className='iconbtn';help.textContent='?';help.title='Help';
    help.onclick=showHelp;bar.appendChild(help);
    const st=document.createElement('button');st.className='iconbtn';st.textContent='⚙';st.title='Settings';
    st.onclick=showSettings;bar.appendChild(st);
  }
};

ModeStudio.registerMode({
  id:'simple',name:'SIMPLE',icon:'☺',
  render(){return `<div id="simple-root"><div id="sm-body"></div></div>`;},
  init(){
    const st=Store.data.simple||(Store.data.simple={goal:null});
    const body=document.getElementById('sm-body');

    const welcome=()=>{
      body.innerHTML=`
        <h1 class="sm-h1">What would you like to do?</h1>
        <p class="sm-lead">Pick the one that sounds like what you want. You can't break anything here — nothing happens on your computer until you decide to run it.</p>
        <div class="sm-cards">${SIMPLE_GOALS.map(g=>`
          <button class="sm-card" data-g="${g.id}">
            <span class="sm-card-t">${esc(g.label)}</span>
            <span class="sm-card-d">${esc(g.plain)}</span>
          </button>`).join('')}</div>
        <div class="sm-foot">
          <p class="sm-lead">Don't see what you need? Describe it in your own words:</p>
          <input id="sm-ask" placeholder="for example: I want the AI to stop forgetting things">
          <p class="sm-tiny">Already comfortable with this? <button class="sm-link" id="sm-adv">Show me all the tools</button></p>
        </div>`;
      body.querySelectorAll('.sm-card').forEach(b=>b.onclick=()=>{
        st.goal=b.dataset.g;answer();});
      document.getElementById('sm-adv').onclick=()=>ModeStudio.switchMode('control');
      document.getElementById('sm-ask').addEventListener('keydown',e=>{
        if(e.key!=='Enter')return;
        const q=e.target.value.toLowerCase();
        const words=q.split(/\W+/).filter(w=>w.length>3);
        let best=null,score=0;
        SIMPLE_GOALS.forEach(g=>{
          const hay=(g.label+' '+g.plain).toLowerCase();
          const s=words.filter(w=>hay.includes(w)).length;
          if(s>score){score=s;best=g;}});
        if(best&&score>0){st.goal=best.id;answer();}
        else toast('I could not match that — try picking one of the choices above','err');
      });
    };

    const assemble=(g)=>g.parts.map((p,j)=>typeof p==='string'?p
      :((body.querySelector('input[data-j="'+j+'"]')||{}).value||p.d||'')).join('');

    const answer=()=>{
      const g=SIMPLE_GOALS.find(x=>x.id===st.goal);
      if(!g){welcome();return;}
      const chat=g.where==='chat';
      body.innerHTML=`
        <button class="sm-link sm-back" id="sm-back">&larr; Choose something else</button>
        <h1 class="sm-h1">${esc(g.label)}</h1>
        <p class="sm-lead">${esc(g.plain)}</p>
        ${g.caution?`<div class="sm-caution"><b>Read this first.</b> ${esc(g.caution)}</div>`:''}
        <h2 class="sm-h2">Here is your command</h2>
        <p class="sm-lead sm-tight">The blue boxes are yours to change. Type in them if you want something different.</p>
        <div class="sm-cmd">${g.parts.map((p,j)=>typeof p==='string'
          ?`<span>${esc(p)}</span>`
          :`<input class="sm-blank" data-j="${j}" value="${esc(p.d||'')}" placeholder="${esc(p.h||'')}" aria-label="${esc(p.n)}">`).join('')}</div>
        <button class="sm-primary" id="sm-copy">Copy this command</button>
        <h2 class="sm-h2">What each piece means</h2>
        <ul class="sm-pieces">${g.pieces.map(p=>
          `<li><code>${esc(p[0])}</code><span>${esc(p[1])}</span></li>`).join('')}</ul>
        <h2 class="sm-h2">Where do I put it?</h2>
        ${chat?`
        <p class="sm-lead">This one goes <b>inside a conversation you have already started</b> — not into the black window on its own. Start a chat first (that is the very first choice on the previous screen), then paste this at the prompt and press <b>Enter</b>.</p>`
        :`
        <p class="sm-lead">This one goes into a program already on your computer called <b>Terminal</b> (on a Mac) or <b>PowerShell</b> (on Windows). It is a plain window where you type instructions. Here is how to find it:</p>
        <div class="sm-steps">
          <div class="sm-os"><h3>On a Mac</h3><ol>
            <li>Hold the <b>Command</b> key and press the <b>space bar</b>. A search box appears in the middle of the screen.</li>
            <li>Type the word <b>Terminal</b> and press <b>Enter</b>. A window of plain text opens.</li>
            <li>Click once inside that window, then hold <b>Command</b> and press <b>V</b> to paste.</li>
            <li>Press <b>Enter</b>. That is it.</li>
          </ol></div>
          <div class="sm-os"><h3>On Windows</h3><ol>
            <li>Press the <b>Windows</b> key on your keyboard. A search box appears.</li>
            <li>Type <b>PowerShell</b> and press <b>Enter</b>. A window of plain text opens.</li>
            <li>Click once inside that window, then hold <b>Ctrl</b> and press <b>V</b> to paste.</li>
            <li>Press <b>Enter</b>. That is it.</li>
          </ol></div>
        </div>
        <p class="sm-lead"><b>First time doing this?</b> You need the free Ollama program installed before any of these will work. It comes from ollama.com — download it, open it like any other program, then come back here.</p>`}
        <p class="sm-reassure">Nothing here can damage your computer. If a command is not right, the window simply says so, and you try another.</p>
        <p class="sm-tiny"><button class="sm-link" id="sm-adv2">Show me all the tools</button></p>`;
      document.getElementById('sm-back').onclick=()=>{st.goal=null;welcome();};
      document.getElementById('sm-adv2').onclick=()=>ModeStudio.switchMode('control');
      document.getElementById('sm-copy').onclick=()=>{
        copyText(assemble(g));
        toast('<b>Copied.</b> Now paste it where the steps below say.');};
    };

    st.goal?answer():welcome();
  }
});

let creatSortables=[];
ModeStudio.registerMode({
  id:'creativity',name:'CREATE',icon:'◫',
  render(){return `<div class="wrap">
    <h2 class="modehead">CREATIVITY MODE</h2>
    <p class="modesub">Organize commands into pockets. Drag pockets to reorder; drag chips between pockets; drag from the library to add. Click a chip to copy.</p>
    <div class="toolrow"><button class="btn primary" id="cr-new">+ New pocket</button></div>
    <div id="creat-layout">
      <div id="creat-canvas"></div>
      <div id="creat-side"><h4>Command library</h4>
        <input type="text" id="cr-filter" placeholder="filter…">
        <div id="cr-lib" class="pocket-content" style="padding:0"></div>
      </div>
    </div></div>`;},
  init(){
    const st=Store.data.creativity;
    const canvas=document.getElementById('creat-canvas');
    const lib=document.getElementById('cr-lib');
    const chip=(c)=>`<div class="pchip c-${c.cat}" data-id="${c.id}"><span class="t">${esc(c.cmd)}</span><span class="x" title="remove">✕</span></div>`;
    const drawLib=()=>{
      const q=(document.getElementById('cr-filter').value||'').toLowerCase();
      lib.innerHTML=allCommands().filter(c=>!q||c.cmd.toLowerCase().includes(q))
        .map(c=>`<div class="pchip c-${c.cat}" data-id="${c.id}"><span class="t">${esc(c.cmd)}</span></div>`).join('');
      new Sortable(lib,{group:{name:'commands',pull:'clone',put:false},sort:false,animation:150,ghostClass:'ghost'});
    };
    const draw=()=>{
      creatSortables.forEach(s=>s.destroy());creatSortables=[];
      canvas.innerHTML=st.pockets.map(p=>`
        <div class="pocket" data-id="${p.id}">
          <div class="pocket-header"><span class="dot" style="background:${esc(p.color)}"></span>
            <span class="pname">${esc(p.name)}</span>
            <button class="minibtn edit">edit</button>
            <button class="minibtn danger del">del</button></div>
          <div class="pocket-content">${p.commands.map(id=>{const c=cmdById(id);return c?chip(c):'';}).join('')}</div>
        </div>`).join('');
      creatSortables.push(new Sortable(canvas,{animation:150,handle:'.pocket-header',ghostClass:'ghost',
        onEnd:()=>{const ids=[...canvas.children].map(el=>el.dataset.id);
          st.pockets.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));}}));
      canvas.querySelectorAll('.pocket').forEach(pel=>{
        const pid=pel.dataset.id;
        creatSortables.push(new Sortable(pel.querySelector('.pocket-content'),{
          group:'commands',animation:150,ghostClass:'ghost',
          onSort:()=>syncPocket(pid,pel),onAdd:()=>syncPocket(pid,pel)}));
        pel.querySelector('.del').onclick=()=>{
          if(confirm('Delete pocket "'+cmdSafe(pid)+'"?')){st.pockets=st.pockets.filter(p=>p.id!==pid);draw();}};
        pel.querySelector('.edit').onclick=()=>editPocket(pid);
      });
      bindChips();
    };
    const cmdSafe=pid=>{const p=st.pockets.find(x=>x.id===pid);return p?p.name:'';};
    const syncPocket=(pid,pel)=>{
      const p=st.pockets.find(x=>x.id===pid);if(!p)return;
      p.commands=[...pel.querySelectorAll('.pchip')].map(el=>el.dataset.id);
      bindChips();
    };
    const bindChips=()=>{
      canvas.querySelectorAll('.pchip').forEach(el=>{
        el.querySelector('.t').onclick=()=>copyCmd(cmdById(el.dataset.id));
        const x=el.querySelector('.x');
        if(x)x.onclick=(e)=>{e.stopPropagation();
          const pel=el.closest('.pocket');el.remove();syncPocket(pel.dataset.id,pel);};
      });
    };
    const editPocket=(pid)=>{
      const p=st.pockets.find(x=>x.id===pid);if(!p)return;
      openModal(`<h3>Edit pocket</h3>
        <label>Name</label><input id="pk-name" value="${esc(p.name)}">
        <label>Color</label><input id="pk-color" type="color" value="${esc(p.color)}" style="height:40px;padding:2px">
        <div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" id="pk-save">Save</button></div>`,

ModeStudio.registerMode({
  id:'speedrun',name:'SPEED',icon:'≫',
  render(){return `<div class="termwrap">
    <h2 class="modehead">SPEED RUN</h2>
    <p class="modesub">Type, Enter to copy, repeat. Up/Down recalls history. Autocomplete from the database.</p>
    <div id="sr-stats"><div><b id="sr-cpm">0</b>copies/min</div><div><b id="sr-total">0</b>total this run</div></div>
    <div id="sr-hist"></div>
    <div class="termline"><span class="ps1">deepseek❯</span>
      <input id="sr-in" list="sr-dl" autocomplete="off" spellcheck="false">
      <datalist id="sr-dl">${allCommands().filter(c=>c.kind!=='key').map(c=>`<option value="${esc(c.cmd)}">`).join('')}</datalist>
    </div></div>`;},
  init(){
    const st=Store.data.speedrun;let hi=-1;
    const inp=document.getElementById('sr-in');
    const hist=document.getElementById('sr-hist');
    const drawHist=()=>{hist.innerHTML=st.history.slice(-60).reverse()
      .map(h=>`<div class="histline"><b>✓</b> ${esc(h)}</div>`).join('');};
    const stats=()=>{
      const now=Date.now();st.stamps=st.stamps.filter(t=>now-t<60000);
      document.getElementById('sr-cpm').textContent=st.stamps.length;
      document.getElementById('sr-total').textContent=st.history.length;};
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&inp.value.trim()){
        const v=inp.value.trim();copyText(v);
        st.history.push(v);st.stamps.push(Date.now());
        inp.value='';hi=-1;drawHist();stats();
      }else if(e.key==='ArrowUp'){e.preventDefault();
        if(st.history.length){hi=hi<0?st.history.length-1:Math.max(0,hi-1);inp.value=st.history[hi];}}
      else if(e.key==='ArrowDown'){e.preventDefault();
        if(hi>=0){hi=Math.min(st.history.length-1,hi+1);inp.value=st.history[hi];
          if(hi===st.history.length-1)hi=-1,inp.value='';}}
    });
    this._tick=setInterval(stats,3000);
    drawHist();stats();inp.focus();
  },
  destroy(){clearInterval(this._tick);}
});

ModeStudio.registerMode({
  id:'challenge',name:'TRAIN',icon:'◎',
  render(){return `<div class="wrap"><div id="ch-box">
    <h2 class="modehead">CHALLENGE</h2>
    <div id="ch-score"><div><b id="ch-c">0</b>correct</div><div><b id="ch-w">0</b>missed</div><div><b id="ch-s">0</b>streak</div></div>
    <div class="toolrow" style="justify-content:center">
      <button class="chip on" data-g="flash">flashcard</button>
      <button class="chip" data-g="mc">multiple choice</button>
      <button class="chip" data-g="type">speed type</button></div>
    <div id="ch-q"></div>
    <div id="ch-area"></div>
    <div id="ch-feedback"></div>
    <div class="modalfoot" style="justify-content:center"><button class="btn" id="ch-next">Next →</button></div>
  </div></div>`;},
  init(){
    const st=Store.data.challenge;let game='flash',cur=null,t0=0;
    const S=()=>{document.getElementById('ch-c').textContent=st.correct;
      document.getElementById('ch-w').textContent=st.incorrect;
      document.getElementById('ch-s').textContent=st.streak;};
    const fb=(ok,msg)=>{const f=document.getElementById('ch-feedback');
      f.style.color=ok?'var(--green)':'var(--red)';f.textContent=msg;
      ok?(st.correct++,st.streak++):(st.incorrect++,st.streak=0);S();};
    const pick=()=>{const l=allCommands();return l[Math.floor(Math.random()*l.length)];};
    const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ');
    const next=()=>{
      cur=pick();t0=Date.now();
      document.getElementById('ch-feedback').textContent='';
      const area=document.getElementById('ch-area');
      if(game==='flash'){
        document.getElementById('ch-q').textContent='Which command: "'+cur.desc+'"';
        area.innerHTML='<input id="ch-in" placeholder="type the command…" style="width:100%">';
        wire();
      }else if(game==='mc'){
        document.getElementById('ch-q').textContent='"'+cur.desc+'"';
        const opts=[cur];while(opts.length<4){const o=pick();if(!opts.find(x=>x.id===o.id))opts.push(o);}
        opts.sort(()=>Math.random()-.5);
        area.innerHTML='<div id="ch-opts">'+opts.map(o=>
          `<button class="btn" data-id="${o.id}">${esc(o.cmd)}</button>`).join('')+'</div>';
        area.querySelectorAll('button').forEach(b=>b.onclick=()=>{
          const ok=b.dataset.id===cur.id;
          b.classList.add(ok?'correct':'wrong');
          if(!ok)area.querySelector(`[data-id="${cur.id}"]`).classList.add('correct');
          fb(ok,ok?'Correct.':'It was: '+cur.cmd);
          area.querySelectorAll('button').forEach(x=>x.disabled=true);});
      }else{
        document.getElementById('ch-q').innerHTML='Type exactly: <b style="color:var(--cyan)">'+esc(cur.cmd)+'</b>';
        area.innerHTML='<input id="ch-in" placeholder="go…" style="width:100%">';
        wire(true);
      }
      const i=document.getElementById('ch-in');if(i)i.focus();
    };
    const wire=(timed)=>{
      document.getElementById('ch-in').addEventListener('keydown',e=>{
        if(e.key!=='Enter')return;
        const v=norm(e.target.value),ok=v===norm(cur.cmd);
        if(timed){const s=((Date.now()-t0)/1000).toFixed(1);
          fb(ok,ok?'Clean, '+s+'s.':'Typo — '+s+'s. Answer: '+cur.cmd);}
        else fb(ok,ok?'Correct.':'Answer: '+cur.cmd);
        e.target.disabled=true;});
    };
    document.querySelectorAll('#ch-box .chip').forEach(c=>c.onclick=()=>{
      game=c.dataset.g;
      document.querySelectorAll('#ch-box .chip').forEach(x=>x.classList.toggle('on',x===c));
      next();});
    document.getElementById('ch-next').onclick=next;
    S();next();
  }
});

let macSortables=[];
ModeStudio.registerMode({
  id:'macro',name:'MACRO',icon:'⧉',
  render(){return `<div class="wrap">

      </div>
    </div></div>`;},
  init(){
    const st=Store.data.macro;
    const list=document.getElementById('mac-list');
    const lib=document.getElementById('mc-lib');
    const drawLib=()=>{
      const q=(document.getElementById('mc-filter').value||'').toLowerCase();
      lib.innerHTML=allCommands().filter(c=>c.kind!=='key'&&(!q||c.cmd.toLowerCase().includes(q)))
        .map(c=>`<div class="pchip c-${c.cat}" data-id="${c.id}"><span class="t">${esc(c.cmd)}</span></div>`).join('');
      new Sortable(lib,{group:{name:'mac',pull:'clone',put:false},sort:false,animation:150,ghostClass:'ghost'});
    };
    const draw=()=>{
      macSortables.forEach(s=>s.destroy());macSortables=[];
      list.innerHTML=st.macros.map(m=>`
        <div class="macro" data-id="${m.id}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h4>@${esc(m.name)}</h4>
            <div><button class="minibtn ren">rename</button>
            <button class="minibtn danger del">del</button></div></div>
          <div class="seq">${m.seq.map(id=>{const c=cmdById(id);
            return c?`<div class="pchip c-${c.cat}" data-id="${c.id}"><span class="t">${esc(c.cmd)}</span><span class="x">✕</span></div>`:'';}).join('')}</div>
          <button class="btn primary run">▶ Run macro</button>
        </div>`).join('')||'<p style="color:var(--faint)">No macros yet — create one and drag commands in.</p>';
      list.querySelectorAll('.macro').forEach(el=>{
        const m=st.macros.find(x=>x.id===el.dataset.id);
        const seq=el.querySelector('.seq');
        macSortables.push(new Sortable(seq,{group:'mac',animation:150,ghostClass:'ghost',
          onSort:()=>sync(m,seq),onAdd:()=>sync(m,seq)}));
        el.querySelector('.run').onclick=()=>{
          const lines=m.seq.map(id=>{const c=cmdById(id);return c?c.cmd:null;}).filter(Boolean);
          if(!lines.length){toast('Macro is empty','err');return;}
          copyText(lines.join('\n'));};

          st.macros=st.macros.filter(x=>x.id!==m.id);draw();}};
        el.querySelector('.ren').onclick=()=>{
          const n=prompt('Macro name:',m.name);if(n){m.name=n;draw();}};
        bindX(el,m);
      });
    };
    const sync=(m,seq)=>{m.seq=[...seq.querySelectorAll('.pchip')].map(el=>el.dataset.id);bindX(seq.closest('.macro'),m);};
    const bindX=(el,m)=>{el.querySelectorAll('.pchip .x').forEach(x=>x.onclick=e=>{
      e.stopPropagation();const chip=x.closest('.pchip');const seq=chip.closest('.seq');
      chip.remove();sync(m,seq);});};
    document.getElementById('mc-new').onclick=()=>{
      const n=prompt('Macro name:','my-macro');
      if(n){st.macros.push({id:'m'+Date.now(),name:n,seq:[]});draw();}};
    document.getElementById('mc-filter').addEventListener('input',drawLib);
    draw();drawLib();
  },
  destroy(){macSortables.forEach(s=>s.destroy());macSortables=[];}
});

    const T=TEMPLATES.filter(t=>harnessMatch(t.harness));
    list.innerHTML=T.map((t,i)=>{
      const base=t.base?cmdById(t.base):null;
      return `<div class="fbrow" data-i="${i}">
        <div class="fbdesc">${esc(t.desc||(base&&base.desc)||'')}</div>
        <div class="fbline">${t.parts.map((p,j)=>typeof p==='string'
          ?`<span class="fblit">${esc(p)}</span>`
          :`<input class="blank" data-j="${j}" placeholder="${esc(p.h||p.n)}" value="${esc(p.d||'')}" size="${Math.max((p.d||p.h||p.n).length,4)}">`).join('')}
          <button class="minibtn fbcopy">copy</button></div></div>`;}).join('');
    list.querySelectorAll('.fbrow').forEach(row=>{
      row.querySelector('.fbcopy').onclick=()=>{
        const t=T[+row.dataset.i];
        const out=t.parts.map((p,j)=>typeof p==='string'?p
          :(row.querySelector(`input[data-j="${j}"]`).value||p.d||'')).join('');
        copyText(out);};
      row.querySelectorAll('input.blank').forEach(inp=>
        inp.addEventListener('input',()=>{inp.size=Math.max(inp.value.length,4);}));
    });
  }
});

/* ═══════════════ MODE: COMMAND BUILDER ═══════════════ */
ModeStudio.registerMode({
  id:'builder',name:'BUILD',icon:'⊞',
  render(){return `<div class="wrap">
    <h2 class="modehead">COMMAND BUILDER</h2>
    <p class="modesub">Tap chunks to snap them into the tray; drag to reorder; add custom text (API keys, paths, prompts) wherever the command needs it. The status line below the tray tells you what your chain does and whether it's a real, complete command.</p>
    <div id="bl-guide">
      <h4>What do you need the command to do?</h4>
      <input id="bl-goal-q" placeholder='describe it and press Enter — e.g. "make replies more creative"'>
      <div id="bl-goal-chips" class="bl-chips"></div>
      <div id="bl-goal-active"></div>
    </div>
    <div id="bl-tray"></div>
    <div id="bl-status" aria-live="polite"></div>
    <div class="toolrow">
      <button class="btn" id="bl-custom">+ custom text</button>
      <button class="btn danger" id="bl-clear">clear</button>
      <button class="btn primary" id="bl-copy">copy command</button></div>
    <code id="bl-preview"></code>
    <div id="bl-palette"></div></div>`;},
  init(){
    const st=Store.data.builder;
    if(!('goal' in st))st.goal=null;
    const tray=document.getElementById('bl-tray');
    const prev=document.getElementById('bl-preview');
    const statusEl=document.getElementById('bl-status');
    const ga=document.getElementById('bl-goal-active');
    const goals=GOALS.filter(g=>harnessMatch(g.harness));
    const chipsEl=document.getElementById('bl-goal-chips');
    const goalOf=()=>GOALS.find(g=>g.id===st.goal)||null;
    const progress=(g)=>{let i=0;while(i<g.chunks.length&&st.seq[i]&&st.seq[i].txt===g.chunks[i])i++;return i;};
    const setGoal=(g)=>{st.goal=g?g.id:null;drawAll();};

    chipsEl.innerHTML=goals.map(g=>`<button class="chip" data-g="${g.id}">${esc(g.label)}</button>`).join('');
    chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      const g=GOALS.find(x=>x.id===b.dataset.g);
      setGoal(st.goal===g.id?null:g);});
    document.getElementById('bl-goal-q').addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      const q=e.target.value.toLowerCase();
      let best=null,score=0;
      goals.forEach(g=>{const s=g.kw.filter(k=>q.includes(k)).length+(q.includes(g.label.toLowerCase())?2:0);
        if(s>score){score=s;best=g;}});
      if(best)setGoal(best);
      else toast('No guided recipe matches that — build freely and watch the status line','err');
    });

    const drawGuide=()=>{
      const g=goalOf();
      chipsEl.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',!!g&&b.dataset.g===g.id));
      if(!g){ga.innerHTML='';return;}
      const p=progress(g);
      ga.innerHTML=p>=g.chunks.length
        ?`<span class="ok">✓ Goal complete — this chain does it. Hit copy.</span> <button class="minibtn" id="bl-goal-x">done</button>`
        :`Guiding: <b>${esc(g.label)}</b> — step ${p+1} of ${g.chunks.length}: tap the glowing <b class="next">${esc(g.chunks[p])}</b> chunk below.${p===0&&st.seq.length?' <span class="warn">Your tray differs from this recipe — clear it, or keep building freely.</span>':''} <button class="minibtn" id="bl-goal-x">stop guiding</button>`;
      const x=document.getElementById('bl-goal-x');if(x)x.onclick=()=>setGoal(null);
    };
    const highlight=()=>{
      const g=goalOf();const p=g?progress(g):-1;
      document.querySelectorAll('#bl-palette .chip').forEach(b=>{
        b.classList.remove('hint-next','hint-later');
        if(!g||p>=g.chunks.length)return;
        if(b.dataset.c===g.chunks[p])b.classList.add('hint-next');
        else if(g.chunks.indexOf(b.dataset.c)>p)b.classList.add('hint-later');
      });
    };
    const drawStatus=()=>{
      const a=analyzeChain(st.seq.map(s=>s.txt));
      const icon={valid:'✓',partial:'◐',invalid:'✗',unknown:'?',empty:'·'}[a.status];
      statusEl.className='st-'+a.status;
      statusEl.innerHTML=`<span class="ic">${icon}</span><span>${esc(a.explain)}${a.hint?' <i>'+esc(a.hint)+'</i>':''}</span>`;
    };
    const draw=()=>{
      tray.innerHTML=st.seq.map((s,i)=>
        `<div class="pchip ${s.custom?'custom':''} c-config" data-i="${i}" title="${esc(glossFor(s.txt))}"><span class="t">${esc(s.txt)}</span><span class="x">✕</span></div>`).join('')
        ||'<span class="bl-empty">tray is empty — pick a goal above or tap chunks below</span>';
      prev.textContent=st.seq.map(s=>s.txt).join(' ')||'…';
      tray.querySelectorAll('.x').forEach(x=>x.onclick=()=>{
        st.seq.splice(+x.closest('.pchip').dataset.i,1);drawAll();});
    };
    const drawAll=()=>{draw();drawStatus();drawGuide();highlight();};

    this._sort=new Sortable(tray,{animation:150,ghostClass:'ghost',draggable:'.pchip',onEnd:()=>{
      const order=[...tray.querySelectorAll('.pchip')].map(el=>+el.dataset.i);
      st.seq=order.map(i=>st.seq[i]);drawAll();}});
    document.getElementById('bl-palette').innerHTML=CHUNK_GROUPS.filter(g=>harnessMatch(g.harness)).map(g=>`
      <div class="bl-group"><h4>${esc(g.name)}</h4><div class="bl-chips">${
        g.chunks.map(c=>`<button class="chip" data-c="${esc(c)}" title="${esc(glossFor(c))}">${esc(c)}</button>`).join('')}</div></div>`).join('');
    document.querySelectorAll('#bl-palette .chip').forEach(b=>b.onclick=()=>{
      st.seq.push({txt:b.dataset.c});drawAll();});
    document.getElementById('bl-custom').onclick=()=>{
      const v=prompt('Custom text (API key, path, model tag, prompt…):');
      if(v){st.seq.push({txt:v,custom:true});drawAll();}};
    document.getElementById('bl-clear').onclick=()=>{st.seq=[];drawAll();};
    document.getElementById('bl-copy').onclick=()=>{
      if(!st.seq.length){toast('Tray is empty','err');return;}
      copyText(st.seq.map(s=>s.txt).join(' '));};
    drawAll();
  },
  destroy(){if(this._sort)this._sort.destroy();}
});

/* ═══════════════ SETTINGS + HELP ═══════════════ */
function showSettings(){
  openModal(`<h3>Settings</h3>
    <p style="color:var(--dim);font-size:12px;margin-bottom:8px">State lives in memory for this session. Export to keep your layout, presets, macros, and custom commands; import to restore them.</p>
    <div class="modalfoot" style="justify-content:flex-start">
      <button class="btn primary" id="st-exp">Export config (JSON)</button>
      <button class="btn" id="st-imp">Import config</button>
      <input type="file" id="st-file" accept="application/json" style="display:none">
      <button class="btn" id="st-theme">Toggle theme</button>
    </div>
    <div class="modalfoot"><button class="btn" onclick="closeModal()">Close</button></div>`,
    m=>{
      m.querySelector('#st-exp').onclick=()=>Store.export();
      m.querySelector('#st-imp').onclick=()=>m.querySelector('#st-file').click();
      m.querySelector('#st-file').onchange=e=>{if(e.target.files[0]){Store.import(e.target.files[0]);closeModal();}};
      m.querySelector('#st-theme').onclick=()=>{
        Store.data.theme=Store.data.theme==='dark'?'light':'dark';applyTheme();};
    });
}
function showHelp(){
  openModal(`<h3>Help</h3>
    ${ModeStudio.order.map((id,i)=>{const m=ModeStudio.modes[id];
      return `<div class="helprow"><kbd>Ctrl+${i+1}</kbd><b style="color:var(--ink)">${esc(m.name)}</b><span>${helpText(id)}</span></div>`;}).join('')}
    <div class="helprow"><kbd>Ctrl+K</kbd><span>focus search (where present)</span></div>
    <div class="helprow"><kbd>Esc</kbd><span>close modal / leave Zen</span></div>
    <div class="modalfoot"><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function helpText(id){return{
  simple:'plain-English start — pick a goal, get a ready command',
  control:'searchable database, click to copy',
  creativity:'drag-and-drop pockets for your own layout',
  speedrun:'terminal-style rapid copy with history and CPM',
  quick:'one-click launch snippets with system prompts',
  edit:'modify commands, add custom ones',
  zen:'nothing but a prompt',
  explorer:'commands grouped by task, with examples',
  challenge:'flashcards, multiple choice, speed typing',
  macro:'chain commands into pasteable sequences',
  blanks:'command templates with typed blanks',
  builder:'assemble complex commands chunk by chunk'}[id]||'';}

/* ═══════════════ GLOBAL KEYS + BOOT ═══════════════ */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&!e.shiftKey&&e.key>='1'&&e.key<='9'){
    const id=ModeStudio.order[+e.key-1];
    if(id){e.preventDefault();ModeStudio.switchMode(id);}}
  if(e.ctrlKey&&(e.key==='k'||e.key==='K')){
    const s=document.getElementById('cc-q')||document.getElementById('ex-q')||
            document.getElementById('cr-filter')||document.getElementById('mc-filter');
    if(s){e.preventDefault();s.focus();}}
  if(e.key==='Escape')closeModal();
});
ModeStudio.buildBar();
applyTheme();
ModeStudio.switchMode(Store.data.activeMode);
</script>
